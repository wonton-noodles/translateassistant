        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            color: var(--text-main); 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
            transition: color 0.4s ease;
            position: relative;
        }

        /* ================= 滚动条全局美化适配 ================= */
        ::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }
        ::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 4px;
            transition: background 0.2s ease, border-color 0.2s ease;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--scrollbar-thumb-hover);
        }
        ::-webkit-scrollbar-corner {
            background: transparent;
        }

        * {
            scrollbar-width: thin;
            scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
        }

        ::selection {
            background: var(--accent-color);
            color: #ffffff;
        }

        /* ================= 动态背景渲染引擎 ================= */
        .ambient-wallpaper {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            overflow: hidden;
            background: var(--bg-color-4);
            transition: background 0.5s ease;
        }

        /* 全局全屏低不透明度放大封面浮现底图背景 */
        .shelf-global-bg-cover {
            position: absolute;
            top: -10%; left: -10%; width: 120%; height: 120%;
            background-size: cover;
            background-position: center;
            filter: blur(28px) brightness(0.9);
            opacity: 0;
            transform: scale(1.15);
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            z-index: 0;
        }
        .shelf-global-bg-cover.active {
            opacity: 0.22;
            transform: scale(1);
        }

        .bg-style-mesh .mesh-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.75;
            animation: meshFloat 18s infinite alternate ease-in-out;
            transition: background 0.8s ease;
            display: block;
        }
        .bg-style-mesh .blob-1 { width: 50vw; height: 50vw; top: -10vw; left: -10vw; background: var(--bg-color-1); animation-duration: 20s; }
        .bg-style-mesh .blob-2 { width: 45vw; height: 45vw; bottom: -10vw; right: -5vw; background: var(--bg-color-2); animation-duration: 25s; animation-delay: -5s; }
        .bg-style-mesh .blob-3 { width: 40vw; height: 40vw; top: 25vw; left: 30vw; background: var(--bg-color-3); animation-duration: 22s; animation-delay: -10s; }

        @keyframes meshFloat {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            33% { transform: translate(10%, 15%) scale(1.1) rotate(120deg); }
            66% { transform: translate(-10%, 5%) scale(0.9) rotate(240deg); }
            100% { transform: translate(5%, -15%) scale(1.05) rotate(360deg); }
        }

        .bg-style-starry {
            background: radial-gradient(ellipse at bottom, var(--bg-color-1) 0%, var(--bg-color-4) 100%);
        }
        .bg-style-starry .star-layer {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, var(--star-color), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, var(--star-color), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, var(--star-color), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, var(--star-color), rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 230px 190px, var(--star-color), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 310px 80px, var(--star-color), rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 350px 350px;
            opacity: 0.7;
            animation: starTwinkle 4s ease-in-out infinite alternate;
        }
        @keyframes starTwinkle {
            0% { opacity: 0.3; transform: scale(0.98); }
            100% { opacity: 0.85; transform: scale(1.02); }
        }

        .bg-style-aurora-wave {
            background: linear-gradient(135deg, var(--bg-color-4), var(--bg-color-2));
        }
        .bg-style-aurora-wave .aurora-wave {
            position: absolute;
            width: 200%; height: 200%;
            top: -50%; left: -50%;
            background: radial-gradient(circle, var(--bg-color-1) 0%, transparent 60%),
                        radial-gradient(circle at 80% 20%, var(--bg-color-3) 0%, transparent 50%);
            opacity: 0.5;
            filter: blur(60px);
            animation: auroraRotate 25s linear infinite;
        }
        @keyframes auroraRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .bg-style-minimal {
            background: linear-gradient(180deg, var(--bg-color-1) 0%, var(--bg-color-2) 50%, var(--bg-color-4) 100%);
            transition: background 0.8s ease;
        }

        .bg-style-grid {
            background-color: var(--bg-color-4);
            background-image: radial-gradient(var(--star-color) 1px, transparent 1px);
            background-size: 24px 24px;
            opacity: 0.9;
        }

        .wallpaper-element { display: none; }
        .bg-style-mesh .mesh-blob { display: block; }
        .bg-style-starry .star-layer { display: block; }
        .bg-style-aurora-wave .aurora-wave { display: block; }

        /* ================= 页面结构样式 ================= */

        .header { 
            position: absolute; top: 0; left: 0; right: 0; height: 54px; 
            background: var(--bg-header); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: var(--text-main); 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 0 24px; z-index: 10; 
            border-bottom: 1px solid var(--border-color); 
            box-shadow: 0 4px 15px var(--shadow-color);
        }
        .header-title { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 10px; }
        .header-actions { display: flex; gap: 10px; align-items: center; }

        .btn { padding: 6px 14px; border-radius: 6px; border: 1px solid transparent; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
        .btn-primary { background: var(--accent-color); color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }
        .btn-secondary { background: var(--glass-bg); color: var(--text-main); border-color: var(--border-color); }
        .btn-secondary:hover { background: var(--bg-card); transform: translateY(-1px); }
        .btn-danger { background: rgba(239, 68, 68, 0.15); color: #ef4444; border-color: rgba(239, 68, 68, 0.3); }
        .btn-danger:hover { background: #ef4444; color: #fff; }
        .btn-warning { background: #f59e0b; color: #fff; box-shadow: 0 2px 8px rgba(245, 158, 11, 0.3); }
        .btn-warning:hover { background: #d97706; }
        .btn-icon { background: none; color: inherit; border: none; cursor: pointer; padding: 4px 6px; border-radius: 4px; transition: 0.2s; }
        .btn-icon:hover { background: rgba(255,255,255,0.2); }

        .select-control {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--glass-bg);
            color: var(--text-main);
            font-size: 12px;
            cursor: pointer;
            outline: none;
            backdrop-filter: blur(10px);
        }

        .view-container { margin-top: 54px; width: 100%; height: calc(100vh - 54px); display: flex; position: relative; }

        /* --- 动态书柜与拟真 3D 视觉建模界面 --- */
        #bookshelf-view { 
            width: 100%; height: 100%; padding: 30px 40px; overflow-y: auto; 
            display: flex; flex-direction: column; align-items: center; 
            position: relative; z-index: 1;
        }
        .shelf-container { width: 100%; max-width: 1100px; }
        .shelf-header-title { text-align: center; margin-bottom: 25px; font-weight: 300; font-size: 26px; letter-spacing: 1.5px; }
        
        /* 3D 仿真书架构造 */
        .shelf-3d-wrapper {
            position: relative;
            margin-bottom: 40px;
            perspective: 1200px;
        }
        .shelf { 
            background: var(--shelf-wood); 
            padding: 30px 30px 20px 30px; 
            border-radius: 8px 8px 4px 4px; 
            box-shadow: inset 0 3px 8px rgba(255,255,255,0.2), inset 0 -6px 15px rgba(0,0,0,0.6), 0 20px 40px var(--shadow-color);

            align-items: flex-end; position: relative; z-index: 2;
        }
        /* 书架 3D 厚度搁板 */
        .shelf-plank {
            height: 18px;
            background: linear-gradient(90deg, rgba(0,0,0,0.3), rgba(255,255,255,0.1) 50%, rgba(0,0,0,0.3)), var(--shelf-wood);
            border-top: 2px solid rgba(255,255,255,0.25);
            box-shadow: 0 12px 25px var(--shelf-shadow);
            border-radius: 0 0 6px 6px;
            position: relative;
        }
        .shelf-plank::after {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: rgba(0,0,0,0.35);
        }
        
        /* 拟真 3D 书籍包装卡片组件 */
        .book-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        .book-card-3d { 
            width: 135px; height: 195px; 
            border-radius: 3px 8px 8px 3px; 
            box-shadow: -4px 0 8px rgba(0,0,0,0.3), 8px 12px 22px rgba(0,0,0,0.35); 
            cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; 
            padding: 12px; color: #fff; 
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), box-shadow 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); 
            transform-style: preserve-3d;
            transform-origin: bottom center; position: relative; 
            overflow: hidden;
            background-color: #2b3a4a;
        }

        /* 实体书封面图背景遮罩 */
        .book-cover-img {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1; border-radius: 3px 8px 8px 3px;
            transition: transform 0.5s ease;
        }

        /* 3D 浮空流畅动画与阴影增强 */
        .book-wrapper:hover .book-card-3d { 
            transform: translateY(-22px) rotateX(12deg) rotateY(-8deg) scale(1.06); 
            box-shadow: -10px 20px 35px rgba(0,0,0,0.5), 0 30px 45px rgba(0,0,0,0.3); 
        }
        .book-wrapper:hover .book-cover-img {
            transform: scale(1.06);
        }

        /* 实体书侧书脊与立体折光 */
        .book-spine-3d { 
            position: absolute; left: 0; top: 0; bottom: 0; width: 12px; 
            background: linear-gradient(90deg, rgba(255,255,255,0.35) 0%, rgba(0,0,0,0.1) 40%, rgba(0,0,0,0.4) 100%); 
            z-index: 3; border-radius: 3px 0 0 3px; 
        }
        .book-shading {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, rgba(0,0,0,0) 50%, rgba(0,0,0,0.5) 100%);
            z-index: 2; pointer-events: none;
        }

        .book-content-layer {
            position: relative; z-index: 4; height: 100%;

            text-shadow: 0 2px 4px rgba(0,0,0,0.8);

        .book-title { 
            font-weight: 700; font-size: 14px; word-break: break-all; line-height: 1.4; 
            margin-left: 8px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; 
            overflow: hidden; letter-spacing: 0.5px;
        }
        .book-meta { font-size: 11px; opacity: 0.9; margin-left: 8px; background: rgba(0,0,0,0.45); padding: 2px 6px; border-radius: 4px; backdrop-filter: blur(4px); width: fit-content; }
        
        /* 封面下方居中的成品总字数标示 */
        .book-word-count-badge {
            margin-top: 10px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);

        .book-actions-overlay {
            position: absolute; top: 6px; right: 6px; z-index: 5; display: flex; gap: 4px;
            opacity: 0; transition: opacity 0.2s ease;
        }
        .book-wrapper:hover .book-actions-overlay { opacity: 1; }
        .action-btn-mini { background: rgba(0,0,0,0.65); color: #fff; border: 1px solid rgba(255,255,255,0.3); border-radius: 4px; padding: 3px 6px; font-size: 11px; cursor: pointer; transition: 0.2s; }
        .action-btn-mini:hover { background: rgba(0,0,0,0.9); transform: scale(1.08); }

        .add-book-card {

        /* --- 4. 扁平化统计月历 (万年历热力图) --- */

        /* 滚轮式万年历控制器 */

    <script>
        const defaultPresets = [
            {
                id: 'p_default',
                name: '默认标准配置',
                url: 'https://api.openai.com/v1',
                key: '',
                model: 'gpt-4o',
                persona: '你是一位专业的小说翻译家，翻译流畅符合文学阅读习惯。'
            }
        ];

        let store = {
            books: JSON.parse(localStorage.getItem('nk_books') || '[]'),
            presets: JSON.parse(localStorage.getItem('nk_presets') || JSON.stringify(defaultPresets)),
            activePresetId: localStorage.getItem('nk_active_preset_id') || 'p_default',
            theme: localStorage.getItem('nk_theme') || 'light',
            bgStyle: localStorage.getItem('nk_bg_style') || 'bg-style-mesh',
            dailyStats: JSON.parse(localStorage.getItem('nk_daily_stats') || '{}') // 日打卡统计记录 {"2026-09-26": 3200}
        };

        let currentBookId = null;
        let currentVolId = null;
        let currentChapterId = null;
        let currentDraftId = null;
        let targetCoverBookId = null; // 正在编辑封面的书籍ID
        let activeTab = 'chapters';
        
        let currentRawFinalText = '';
        let autoSaveTimer = null; // 成品自动保存防抖定时器
        let translationAbortController = null; // AI翻译拦截控制器
        let lastAutoSaveTimeStr = '未保存';

        // 月历选中的年月变量
        let calSelectedYear = new Date().getFullYear();
        let calSelectedMonth = new Date().getMonth() + 1;

        window.onload = () => {
            if (!store.presets || store.presets.length === 0) {
                store.presets = defaultPresets;
                store.activePresetId = 'p_default';
                saveStore('presets');
                saveStore('active_preset_id');
            }

            switchTheme(store.theme);
            switchBgStyle(store.bgStyle);

            document.getElementById('theme-selector').value = store.theme;
            document.getElementById('bg-selector').value = store.bgStyle;

            // 监听全局划选文字事件，实时统计选中的编辑框文本字数
            document.addEventListener('selectionchange', handleTextSelectionChange);

            initDragFloatKB();
            initColumnResizers();
            renderBookshelf();
            renderCalendar();
        };

        function saveStore(key) {
            localStorage.setItem(`nk_${key}`, JSON.stringify(store[key]));
        }

        function switchTheme(themeName) {
            store.theme = themeName;
            document.body.setAttribute('data-theme', themeName);
            localStorage.setItem('nk_theme', themeName);
        }

        function switchBgStyle(bgClass) {
            store.bgStyle = bgClass;
            document.body.className = bgClass;
            localStorage.setItem('nk_bg_style', bgClass);
        }

        function getActivePreset() {
            let preset = store.presets.find(p => p.id === store.activePresetId);
            if (!preset && store.presets.length > 0) {
                preset = store.presets[0];
                store.activePresetId = preset.id;
            }
            return preset;
        }

        function populatePresetUI() {
            const selector = document.getElementById('preset-selector');
            selector.innerHTML = '';
            store.presets.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id;
                opt.innerText = p.name;
                if (p.id === store.activePresetId) opt.selected = true;
                selector.appendChild(opt);
            });

            const activePreset = getActivePreset();
            if (activePreset) {
                document.getElementById('cfg-url').value = activePreset.url || '';
                document.getElementById('cfg-key').value = activePreset.key || '';
                document.getElementById('cfg-model').value = activePreset.model || '';
                document.getElementById('cfg-persona').value = activePreset.persona || '';
            }
        }

        function switchPreset(presetId) {
            const cur = getActivePreset();
            if (cur) {
                cur.url = document.getElementById('cfg-url').value.trim();
                cur.key = document.getElementById('cfg-key').value.trim();
                cur.model = document.getElementById('cfg-model').value.trim();
                cur.persona = document.getElementById('cfg-persona').value.trim();
            }

            store.activePresetId = presetId;
            saveStore('active_preset_id');
            saveStore('presets');
            populatePresetUI();
        }

        function addNewPreset() {
            const name = prompt("请输入新预设组名称：", "自定义配置组");
            if (!name || !name.trim()) return;
            const newPreset = {
                id: 'p_' + Date.now(),
                name: name.trim(),
                url: 'https://api.openai.com/v1',
                key: '',
                model: 'gpt-4o',
                persona: '你是一位专业的小说翻译家。'
            };
            store.presets.push(newPreset);
            store.activePresetId = newPreset.id;
            saveStore('presets');
            saveStore('active_preset_id');
            populatePresetUI();
        }

        function renameCurrentPreset() {
            const preset = getActivePreset();
            if (!preset) return;
            const newName = prompt("修改预设组名称：", preset.name);
            if (newName && newName.trim()) {
                preset.name = newName.trim();
                saveStore('presets');
                populatePresetUI();
            }
        }

        function deleteCurrentPreset() {
            if (store.presets.length <= 1) {
                return alert("至少保留一个预设配置组！");
            }
            const preset = getActivePreset();
            if (confirm(`确定要删除预设组《${preset.name}》吗？`)) {
                store.presets = store.presets.filter(p => p.id !== preset.id);
                store.activePresetId = store.presets[0].id;
                saveStore('presets');
                saveStore('active_preset_id');
                populatePresetUI();
            }
        }

        function exportPresetsJSON() {
            const dataStr = JSON.stringify(store.presets, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `AI_Translation_Presets_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
        }

        function triggerImportPresets() {
            document.getElementById('file-import-presets').click();
        }

        function importPresetsJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported) && imported.length > 0 && imported[0].name) {
                        if (confirm(`确认导入 ${imported.length} 个预设组？这将合并到现有的预设中。`)) {
                            imported.forEach(p => {
                                p.id = 'p_' + Date.now() + Math.floor(Math.random()*1000);
                                store.presets.push(p);
                            });
                            store.activePresetId = imported[0].id;
                            saveStore('presets');
                            saveStore('active_preset_id');
                            populatePresetUI();
                            alert("预设组导入成功！");
                        }
                    } else {
                        alert("导入失败：JSON 格式不符合预设模板规则。");
                    }
                } catch (err) {
                    alert("解析 JSON 文件失败: " + err.message);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function openSettings() {
            populatePresetUI();
            document.getElementById('modal-settings').style.display = 'flex';
        }

        function saveSettings() {
            const activePreset = getActivePreset();
            if (activePreset) {

        /* --- 计算书籍成品总字数 --- */
        function calculateBookTotalWords(book) {
            if (!book || !book.volumes) return 0;
            let total = 0;
            book.volumes.forEach(v => {
                if (v.chapters) {
                    v.chapters.forEach(c => {
                        total += (c.final || '').length;
                    });
                }
            });
            return total;
        }

        /* --- 4. 统计月历（滚轮万年历 + 打卡热力图） --- */
        function handleCalendarWheel(event, type) {
            event.preventDefault();
            if (type === 'year') {
                if (event.deltaY < 0) calSelectedYear++;
                else calSelectedYear--;
            } else if (type === 'month') {
                if (event.deltaY < 0) {
                    calSelectedMonth++;
                    if (calSelectedMonth > 12) { calSelectedMonth = 1; calSelectedYear++; }
                } else {
                    calSelectedMonth--;
                    if (calSelectedMonth < 1) { calSelectedMonth = 12; calSelectedYear--; }
                }
            }
            renderCalendar();
        }

        function renderCalendar() {
            document.getElementById('wheel-year').innerText = `${calSelectedYear}年 ▾`;
            document.getElementById('wheel-month').innerText = `${String(calSelectedMonth).padStart(2, '0')}月 ▾`;

            const container = document.getElementById('calendar-grid');
            container.innerHTML = '';

            // 星期表头
            const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
            weekDays.forEach(w => {
                const header = document.createElement('div');
                header.className = 'cal-weekday';
                header.innerText = w;
                container.appendChild(header);
            });

            // 获取该月1号与总天数
            const firstDay = new Date(calSelectedYear, calSelectedMonth - 1, 1);
            const startingDay = firstDay.getDay(); // 0 是周日
            const daysInMonth = new Date(calSelectedYear, calSelectedMonth, 0).getDate();

            // 上个月补充空位
            const prevMonthDays = new Date(calSelectedYear, calSelectedMonth - 1, 0).getDate();
            for (let i = startingDay - 1; i >= 0; i--) {
                const cell = document.createElement('div');
                cell.className = 'cal-day-cell other-month';
                cell.innerHTML = `<span class="day-num">${prevMonthDays - i}</span>`;
                container.appendChild(cell);
            }

            const todayObj = new Date();
            const todayStr = `${todayObj.getFullYear()}-${String(todayObj.getMonth() + 1).padStart(2, '0')}-${String(todayObj.getDate()).padStart(2, '0')}`;

            // 渲染本月日期
            for (let day = 1; day <= daysInMonth; day++) {
                const dateKey = `${calSelectedYear}-${String(calSelectedMonth).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const wordCount = store.dailyStats[dateKey] || 0;

                const cell = document.createElement('div');
                cell.className = 'cal-day-cell';

                if (dateKey === todayStr) {
                    cell.classList.add('today');
                }

                let colorLevelClass = '';
                if (wordCount >= 1 && wordCount <= 3000) {
                    colorLevelClass = 'lvl-1';
                } else if (wordCount > 3000 && wordCount <= 6000) {
                    colorLevelClass = 'lvl-2';
                } else if (wordCount > 6000) {
                    colorLevelClass = 'lvl-3';
                }

                if (colorLevelClass) cell.classList.add(colorLevelClass);

                const cntDisplay = wordCount > 0 ? (wordCount > 9999 ? (wordCount/10000).toFixed(1)+'w' : wordCount) : '';
                cell.innerHTML = `<span class="day-num">${day}</span>${cntDisplay ? `<span class="word-cnt">${cntDisplay}</span>` : ''}`;
                cell.title = `${dateKey}: 翻译成品 ${wordCount} 字`;

                container.appendChild(cell);
            }
        }

        /* 记录今日翻译新增字数逻辑 */
        function recordDailyTranslationWords(addedCount) {
            if (addedCount <= 0) return;
            const todayObj = new Date();
            const todayStr = `${todayObj.getFullYear()}-${String(todayObj.getMonth() + 1).padStart(2, '0')}-${String(todayObj.getDate()).padStart(2, '0')}`;
            
            store.dailyStats[todayStr] = (store.dailyStats[todayStr] || 0) + addedCount;
            saveStore('daily_stats');
            renderCalendar();
        }

        function handleTextSelectionChange() {
            const activeElem = document.activeElement;
            const selection = window.getSelection();
            let selectedText = "";

            if (activeElem && (activeElem.tagName === 'TEXTAREA' || activeElem.tagName === 'INPUT')) {
                const start = activeElem.selectionStart;
                const end = activeElem.selectionEnd;
                if (typeof start === 'number' && typeof end === 'number') {
                    selectedText = activeElem.value.substring(start, end);
                }
            } else if (selection && !selection.isCollapsed) {
                selectedText = selection.toString();
            }

            document.getElementById('stat-selected-words').innerText = `🔍 当前选中文字字数: ${selectedText.length}`;
        }

        function updateSaveTimeTag() {
            const now = new Date();
            const timeStr = now.toTimeString().split(' ')[0];
            lastAutoSaveTimeStr = timeStr;
            document.getElementById('stat-last-saved').innerText = `🕒 上次保存: ${timeStr}`;
        }

        function saveCurrentChapter(showAlert = false) {
            if (!currentChapterId) return;
            const book = store.books.find(b => b.id === currentBookId);
            if (!book) return;
            const vol = book.volumes.find(v => v.id === currentVolId);
            if (!vol) return;
            const ch = vol.chapters.find(c => c.id === currentChapterId);
            if (!ch) return;

            ch.source = document.getElementById('txt-source').value;
            ch.target = document.getElementById('txt-ai-target').value;
            ch.final = currentRawFinalText;

            saveStore('books');
            updateSaveTimeTag();
            if (showAlert) alert("本章内容已成功保存！");
        }

        function triggerAutoSave() {
            clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(() => {
                saveCurrentChapter(false);
            }, 500); // 500毫秒防抖自动保存
        }

        function saveCurrentDraft() {
            if (!currentDraftId) return;
            const book = store.books.find(b => b.id === currentBookId);
            const d = book.drafts.find(item => item.id === currentDraftId);
            if (d) {
                d.content = document.getElementById('txt-draft-content').value;
                saveStore('books');
                alert("知识库设定条目已保存！");
            }
        }

        function clearColumn(type) {
            if (type === 'source') {
                document.getElementById('txt-source').value = '';
                updateWordCounts();
            }
        }

        function appendToTarget() {
            const aiText = document.getElementById('txt-ai-target').value;
            if (!aiText) return;
            currentRawFinalText = currentRawFinalText ? currentRawFinalText + '\n\n' + aiText : aiText;
            renderFormattedFinal();
            updateWordCounts();
            recordDailyTranslationWords(aiText.length); // 记录翻译打卡热力图字数
            triggerAutoSave();
        }

        /* --- 三栏宽度自由拖拽调整功能 --- */
        function initColumnResizers() {
            const container = document.getElementById('panel-editor');
            const col1 = document.getElementById('col-1');
            const col2 = document.getElementById('col-2');
            const col3 = document.getElementById('col-3');
            const resizer1 = document.getElementById('resizer-1');
            const resizer2 = document.getElementById('resizer-2');

            let activeResizer = null;
            let startX = 0;
            let startCol1Width = 0, startCol2Width = 0, startCol3Width = 0;

            resizer1.addEventListener('mousedown', (e) => startResize(e, resizer1));
            resizer2.addEventListener('mousedown', (e) => startResize(e, resizer2));

            function startResize(e, resizer) {
                activeResizer = resizer;
                startX = e.clientX;
                startCol1Width = col1.getBoundingClientRect().width;
                startCol2Width = col2.getBoundingClientRect().width;
                startCol3Width = col3.getBoundingClientRect().width;

                resizer.classList.add('resizing');
                document.addEventListener('mousemove', doResize);
                document.addEventListener('mouseup', stopResize);
            }

            function doResize(e) {
                if (!activeResizer) return;
                const deltaX = e.clientX - startX;

                if (activeResizer === resizer1) {
                    const newWidth1 = Math.max(140, startCol1Width + deltaX);
                    const newWidth2 = Math.max(140, startCol2Width - deltaX);
                    col1.style.flex = `0 0 ${newWidth1}px`;
                    col2.style.flex = `0 0 ${newWidth2}px`;
                } else if (activeResizer === resizer2) {
                    const newWidth2 = Math.max(140, startCol2Width + deltaX);
                    const newWidth3 = Math.max(140, startCol3Width - deltaX);
                    col2.style.flex = `0 0 ${newWidth2}px`;
                    col3.style.flex = `0 0 ${newWidth3}px`;
                }
            }

            function stopResize() {
                if (activeResizer) {
                    activeResizer.classList.remove('resizing');
                    activeResizer = null;
                }
                document.removeEventListener('mousemove', doResize);
                document.removeEventListener('mouseup', stopResize);
            }
        }

        /* --- 8. 排版与高亮渲染 Engine (成品分栏) --- */
        function syncFinalFromPreview() {
            const preview = document.getElementById('txt-final-preview');
            currentRawFinalText = preview.innerText;
            updateWordCounts();
            triggerAutoSave();
        }

        function toggleFormatting() {
            const preview = document.getElementById('txt-final-preview');
            const isIndent = document.getElementById('chk-indent').checked;
            const isSpacing = document.getElementById('chk-spacing').checked;

            preview.classList.toggle('indent-active', isIndent);
            preview.classList.toggle('spacing-active', isSpacing);
        }

        function escapeHTML(text) {
            return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function renderFormattedFinal() {
            const preview = document.getElementById('txt-final-preview');
            const findVal = document.getElementById('find-text').value;

            let textToRender = currentRawFinalText;

            if (findVal) {
                const escapeReg = findVal.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const reg = new RegExp(escapeReg, 'gi');
                textToRender = escapeHTML(textToRender).replace(reg, match => `<mark class="search-highlight">${match}</mark>`);
                
                const paragraphs = textToRender.split('\n');
                preview.innerHTML = paragraphs.map(p => p.trim() === '' ? '<p class="empty-para"><br></p>' : `<p>${p}</p>`).join('');
            } else {
                const paragraphs = textToRender.split('\n');
                preview.innerHTML = paragraphs.map(p => p.trim() === '' ? '<p class="empty-para"><br></p>' : `<p>${escapeHTML(p)}</p>`).join('');
            }

            toggleFormatting();
        }

        /* --- 9. 全书/本章 弹出式匹配查找与跳转定位 --- */
        function openSearchModal() {
            const findText = document.getElementById('find-text').value.trim();
            if (!findText) return alert("请输入要查找的关键词！");

            const scope = document.getElementById('search-scope').value;
            const resultsContainer = document.getElementById('search-results-list');
            resultsContainer.innerHTML = '';

            const book = store.books.find(b => b.id === currentBookId);
            if (!book) return;

            let results = [];
            const escapeReg = findText.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const reg = new RegExp(escapeReg, 'gi');

            function searchInChapter(vol, ch) {
                const content = ch.final || '';
                if (!content) return;
                const lines = content.split('\n');
                lines.forEach((line, index) => {
                    if (reg.test(line)) {
                        const highlightedSnippet = escapeHTML(line).replace(reg, match => `<mark class="search-highlight">${match}</mark>`);
                        results.push({
                            volId: vol.id,
                            volTitle: vol.title,
                            chId: ch.id,
                            chTitle: ch.title,
                            snippet: highlightedSnippet,
                            lineNum: index + 1
                        });
                    }
                });
            }

            if (scope === 'chapter') {
                const vol = book.volumes.find(v => v.id === currentVolId);
                const ch = vol ? vol.chapters.find(c => c.id === currentChapterId) : null;
                if (vol && ch) searchInChapter(vol, ch);
            } else {
                book.volumes.forEach(v => {
                    v.chapters.forEach(c => {
                        searchInChapter(v, c);
                    });
                });
            }

            document.getElementById('search-modal-header').innerText = `🔍 匹配关键词“${findText}”的结果 (共 ${results.length} 条)`;

            if (results.length === 0) {
                resultsContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">未找到任何匹配的内容</div>';
            } else {
                results.forEach(res => {
                    const div = document.createElement('div');
                    div.className = 'search-result-item';
                    div.innerHTML = `
                        <div class="search-result-meta">📍 ${res.volTitle} > ${res.chTitle} (第 ${res.lineNum} 行)</div>
                        <div class="search-result-snippet">${res.snippet}</div>
                    `;
                    div.onclick = () => {
                        closeModal('modal-search');
                        selectChapter(res.volId, res.chId);
                    };
                    resultsContainer.appendChild(div);
                });
            }

            document.getElementById('modal-search').style.display = 'flex';
        }

        function executeReplace() {
            const findText = document.getElementById('find-text').value;
            const replaceText = document.getElementById('replace-text').value;
            if (!findText) return;

            const scope = document.getElementById('search-scope').value;
            const escapeReg = findText.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

            if (scope === 'chapter') {
                const reg = new RegExp(escapeReg, 'i');
                if (reg.test(currentRawFinalText)) {
                    currentRawFinalText = currentRawFinalText.replace(reg, replaceText);
                    renderFormattedFinal();
                    updateWordCounts();
                    triggerAutoSave();
                }
            } else {
                const book = store.books.find(b => b.id === currentBookId);
                let replaced = false;

                const reg = new RegExp(escapeReg, 'i');
                if (reg.test(currentRawFinalText)) {
                    currentRawFinalText = currentRawFinalText.replace(reg, replaceText);
                    replaced = true;
                } else if (book) {
                    for (let v of book.volumes) {
                        for (let c of v.chapters) {
                            if (c.final && reg.test(c.final)) {
                                c.final = c.final.replace(reg, replaceText);
                                replaced = true;
                                break;
                            }
                        }
                        if (replaced) break;
                    }
                }
                if (replaced) {
                    saveStore('books');
                    renderFormattedFinal();
                    updateWordCounts();
                }
            }
        }

        function executeReplaceAll() {
            const findText = document.getElementById('find-text').value;
            const replaceText = document.getElementById('replace-text').value;
            if (!findText) return;

            const scope = document.getElementById('search-scope').value;
            const escapeReg = findText.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const reg = new RegExp(escapeReg, 'gi');

            if (scope === 'chapter') {
                currentRawFinalText = currentRawFinalText.replace(reg, replaceText);
            } else {
                const book = store.books.find(b => b.id === currentBookId);
                if (book) {
                    book.volumes.forEach(v => {
                        v.chapters.forEach(c => {
                            if (c.final) {
                                c.final = c.final.replace(reg, replaceText);
                            }
                        });
                    });
                }
                currentRawFinalText = currentRawFinalText.replace(reg, replaceText);
                saveStore('books');
            }

            renderFormattedFinal();
            updateWordCounts();
            triggerAutoSave();
        }

        /* --- 10. 悬浮便签知识库组件 --- */
        function toggleFloatKB() {
            const win = document.getElementById('floating-kb-window');
            if (win.style.display === 'none' || !win.style.display) {
                win.style.display = 'flex';
                populateFloatKBSelect();
            } else {
                win.style.display = 'none';
            }
        }

        function populateFloatKBSelect() {
            const select = document.getElementById('float-kb-select');
            select.innerHTML = '';
            const book = store.books.find(b => b.id === currentBookId);
            if (!book) return;

            book.drafts.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d.id;
                opt.innerText = d.title;
                select.appendChild(opt);
            });

            if (book.drafts.length > 0) {
                switchFloatKBDraft(book.drafts[0].id);
            }
        }

        function switchFloatKBDraft(draftId) {
            const book = store.books.find(b => b.id === currentBookId);
            if (!book) return;
            const d = book.drafts.find(item => item.id === draftId);
            document.getElementById('float-kb-content').value = d ? d.content || '' : '';
        }

        function saveFloatKBContent() {
            const draftId = document.getElementById('float-kb-select').value;
            const content = document.getElementById('float-kb-content').value;
            const book = store.books.find(b => b.id === currentBookId);
            if (!book) return;
            const d = book.drafts.find(item => item.id === draftId);
            if (d) {
                d.content = content;
                saveStore('books');
                if (currentDraftId === draftId) {
                    document.getElementById('txt-draft-content').value = content;
                }
                alert("悬浮便签知识库内容已保存！");
            }
        }

        function copyFloatKBContent() {
            const content = document.getElementById('float-kb-content').value;
            navigator.clipboard.writeText(content).then(() => {
                alert("设定内容已成功复制到剪贴板！");
            });
        }

        function initDragFloatKB() {
            const win = document.getElementById('floating-kb-window');
            const header = document.getElementById('floating-kb-header');
            let isDragging = false;
            let offsetX = 0, offsetY = 0;

            header.addEventListener('mousedown', (e) => {
                isDragging = true;
                offsetX = e.clientX - win.offsetLeft;
                offsetY = e.clientY - win.offsetTop;
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                win.style.left = (e.clientX - offsetX) + 'px';
                win.style.top = (e.clientY - offsetY) + 'px';
            });

            document.addEventListener('mouseup', () => {
                isDragging = false;
            });
        }

        /* --- 11. AI 接口翻译请求 (包含流式传输控制与强拦截) --- */
        function handleTranslateClick() {
            if (translationAbortController) {
                translationAbortController.abort();
                translationAbortController = null;
                setTranslateButtonState(false);
                document.getElementById('txt-ai-target').value += "\n\n[用户已中断翻译]";
            } else {
                translateSlice();
            }
        }

        function setTranslateButtonState(isTranslating) {
            const btn = document.getElementById('btn-ai-translate');
            if (isTranslating) {
                btn.className = "btn btn-warning";
                btn.innerText = "⏳ 翻译中... (点击终止)";
            } else {
                btn.className = "btn btn-primary";
                btn.innerText = "🚀 发送给 AI 翻译";
            }
        }

        async function translateSlice() {
            const sourceText = document.getElementById('txt-source').value.trim();
            if (!sourceText) return alert("请先在第一栏输入或粘贴原文段落！");

            const activePreset = getActivePreset();
            if (!activePreset || !activePreset.key) return alert("请先在设置中选择预设并配置 API Key！");

            const book = store.books.find(b => b.id === currentBookId);
            const knowledgeBase = book.drafts.map(d => `[${d.title}]\n${d.content}`).join('\n\n');
            const persona = activePreset.persona || "你是一位专业的小说翻译家。";
            
            const systemPrompt = `${persona}

【翻译原则与知识库设定约束】
在翻译时，请严格遵守以下专有名词对照及背景设定：
${knowledgeBase || "（暂无特殊参考设定）"}

请直接输出高质量译文，保持文学美感，不要回复多余的解释。`;

            const aiTargetArea = document.getElementById('txt-ai-target');
            const isStream = document.getElementById('chk-stream').checked;

            aiTargetArea.value = isStream ? "" : "AI 正在思考翻译中...";
            setTranslateButtonState(true);

            translationAbortController = new AbortController();

            try {
                let baseUrl = activePreset.url.replace(/\/+$/, "");
                if (!baseUrl.endsWith('/v1')) baseUrl += '/v1';

                const response = await fetch(`${baseUrl}/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${activePreset.key}`
                    },
                    body: JSON.stringify({
                        model: activePreset.model || 'gpt-4o',
                        messages: [
                            { role: "system", content: systemPrompt },
                            { role: "user", content: sourceText }
                        ],
                        temperature: 0.3,
                        stream: isStream
                    }),
                    signal: translationAbortController.signal
                });

                if (!response.ok) throw new Error(`请求失败，状态码: ${response.status}`);

                if (isStream) {
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder("utf-8");
                    let done = false;

                    while (!done) {
                        const { value, done: doneReading } = await reader.read();
                        done = doneReading;
                        const chunkValue = decoder.decode(value, { stream: !done });
                        
                        const lines = chunkValue.split('\n');
                        for (let line of lines) {
                            if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                                try {
                                    const json = JSON.parse(line.substring(6));
                                    const token = json.choices[0]?.delta?.content || '';
                                    aiTargetArea.value += token;
                                    aiTargetArea.scrollTop = aiTargetArea.scrollHeight;
                                } catch (e) {}
                            }
                        }
                    }
                } else {
                    const data = await response.json();
                    aiTargetArea.value = data.choices[0].message.content;
                }

            } catch (err) {
                if (err.name === 'AbortError') {
                    console.log("翻译已被终止");
                } else {
                    alert("翻译失败: " + err.message);
                    aiTargetArea.value = "翻译发生错误，请检查 API 配置。";
                }
            } finally {
                translationAbortController = null;
                setTranslateButtonState(false);
            }
        }

        /* --- 12. 弹窗导出与文本文件构建 --- */
        function openExportModal() {
            const book = store.books.find(b => b.id === currentBookId);
            const select = document.getElementById('export-vol-select');
            select.innerHTML = '';
            book.volumes.forEach(v => {
                const opt = document.createElement('option');
                opt.value = v.id;
                opt.innerText = v.title;
                select.appendChild(opt);
            });
            document.getElementById('modal-export').style.display = 'flex';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function executeExport() {
            const volId = document.getElementById('export-vol-select').value;
            const encoding = document.getElementById('export-encoding').value;
            const book = store.books.find(b => b.id === currentBookId);
            const vol = book.volumes.find(v => v.id === volId);

            let content = `${book.title} - ${vol.title}\n\n`;
            vol.chapters.forEach(ch => {
                content += `=== ${ch.title} ===\n\n${ch.final || ch.target || ''}\n\n`;
            });

            let blob;
            if (encoding === 'GBK') {
                const unicodeArray = Encoding.stringToCode(content);
                const gbkArray = Encoding.convert(unicodeArray, { to: 'GBK', from: 'UNICODE' });
                blob = new Blob([new Uint8Array(gbkArray)], { type: 'text/plain;choice=ansi' });
            } else {
                blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            }

            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `${book.title}_${vol.title}.txt`;
            a.click();
            closeModal('modal-export');
        }
    </script>
